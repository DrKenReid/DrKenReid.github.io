<!DOCTYPE html>
<!-- data-kr-root: GitHub Pages serves this page for any missing path at
     any depth, so its scripts are told where the site root is instead of
     working it out from the URL (see siteRootPrefix). -->
<html lang="en-GB" data-kr-root="/">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <script>(function(){var t;try{t=localStorage.getItem('kr-theme');}catch(e){}if(!t)t='dark';document.documentElement.setAttribute('data-theme',t);})();</script>
  <meta name="description" content="Page not found — Ken Reid">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>404 - Ken Reid</title>
  <script defer src="/js/analytics.js"></script>
  <link rel="icon" href="/img/core-img/favicon.png">
  <link rel="apple-touch-icon" href="/img/core-img/apple-touch-icon.png">
  <meta name="theme-color" content="#1a1a1a">
  <link rel="preload" as="image" href="/img/photography/hero/15.webp" fetchpriority="high">
  <link rel="stylesheet" href="/style.min.css?v=20260923a">
  <script defer src="/js/theme.js?v=20260923a"></script>
  <script defer src="/js/palette.js?v=20260923a"></script>
</head>
<body>
  <div id="header-section"></div>

  <main id="main-content">

  <!-- Page opener (style.css §06, "Page opener"). The h1 says what
       happened in words; the status code is the last crumb. -->
  <section class="breadcrumb-area bg-img bg-overlay jarallax" style="background-image: url(/img/photography/hero/15.webp);">
    <div class="container">
      <div class="breadcrumb-content">
        <nav aria-label="breadcrumb"><ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/index.html"><i class="icon_house_alt"></i> Home</a></li>
          <li class="breadcrumb-item active" aria-current="page">404</li>
        </ol></nav>
        <h1 class="page-title">Page Not Found</h1>
      </div>
    </div>
  </section>

  <div class="about-us-area section-padding-80 clearfix">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-8 text-center">
          <p class="kr-lost__lede">The page you're looking for doesn't exist, was moved, or I broke something. <a href="/contact.html">Please let me know!</a></p>

          <!-- A hill climber looking for the page. It never finds it, because
               there is nothing to find; the joke is the algorithm's problem. -->
          <figure class="kr-lost" aria-hidden="true">
            <canvas id="kr-lost-canvas" width="640" height="150"></canvas>
            <figcaption class="kr-lost__status"><span id="kr-lost-status">Searching…</span></figcaption>
          </figure>
          <script>
          (function () {
            var c = document.getElementById('kr-lost-canvas');
            if (!c || !c.getContext) return;
            var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var status = document.getElementById('kr-lost-status');
            var path = decodeURIComponent(location.pathname || '/');
            var W = 640, H = 150, ctx = c.getContext('2d');

            // A rugged landscape seeded from the path, so every missing URL
            // gets its own hills to be lost in.
            var seed = 0; for (var i = 0; i < path.length; i++) seed = (seed * 31 + path.charCodeAt(i)) >>> 0;
            function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
            var terms = []; for (var k = 0; k < 7; k++) terms.push([1 + k * 1.7, rnd() * 6.28, 0.5 / (k + 1)]);
            function land(x) { var y = 0; for (var t = 0; t < terms.length; t++) y += Math.sin(x * terms[t][0] + terms[t][1]) * terms[t][2]; return y; }

            var x = rnd() * 6.28, best = land(x), stalls = 0, evals = 0, restarts = 0, trail = [];

            function draw() {
              var dark = document.documentElement.getAttribute('data-theme') !== 'light';
              ctx.clearRect(0, 0, W, H);
              ctx.strokeStyle = dark ? 'rgba(232,226,216,0.35)' : 'rgba(60,54,46,0.35)';
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              for (var px = 0; px <= W; px++) {
                var xx = px / W * 6.28, yy = H * 0.6 - land(xx) * 40;
                px ? ctx.lineTo(px, yy) : ctx.moveTo(px, yy);
              }
              ctx.stroke();
              ctx.fillStyle = dark ? 'rgba(255,150,150,0.25)' : 'rgba(197,48,48,0.2)';
              for (var i = 0; i < trail.length; i++) {
                ctx.beginPath(); ctx.arc(trail[i] / 6.28 * W, H * 0.6 - land(trail[i]) * 40, 2, 0, 6.28); ctx.fill();
              }
              ctx.fillStyle = dark ? '#ffe89e' : '#c53030';
              ctx.beginPath(); ctx.arc(x / 6.28 * W, H * 0.6 - land(x) * 40, 5, 0, 6.28); ctx.fill();
            }

            function step() {
              for (var e = 0; e < 3; e++) {
                var cand = x + (rnd() - 0.5) * 0.5;
                if (cand < 0) cand += 6.28; if (cand > 6.28) cand -= 6.28;
                evals++;
                if (land(cand) > best) { best = land(cand); x = cand; stalls = 0; trail.push(x); if (trail.length > 60) trail.shift(); }
                else stalls++;
              }
              if (stalls > 90) { restarts++; stalls = 0; x = rnd() * 6.28; best = land(x); trail = []; }
              draw();
              if (status) status.textContent = 'Searched ' + evals.toLocaleString() + ' places' +
                (restarts ? ', restarted ' + restarts + (restarts === 1 ? ' time' : ' times') : '') +
                '. Still no ' + path + '.';
              if (!reduced && evals < 60000) requestAnimationFrame(step);
            }
            draw();
            if (reduced) { if (status) status.textContent = 'Looked everywhere. No ' + path + '.'; }
            else requestAnimationFrame(step);
          }());
          </script>

          <form action="/blog.html" method="get" role="search" class="kr-lost__search">
            <input type="search" name="q" class="kr-list-search" placeholder="Search the blog instead..." aria-label="Search the blog">
          </form>
          <p class="kr-muted kr-key-hint kr-lost__hint">or press <kbd class="kr-palette-kbd"><kbd class="kr-kbd-mod">Ctrl</kbd> <kbd>K</kbd></kbd> to search everything on the site</p>
          <div class="kr-btn-row">
            <a href="/index.html" class="kr-btn kr-btn--primary">Back to home</a>
            <a href="/blog.html" class="kr-btn kr-btn--ghost">Browse the blog</a>
          </div>
        </div>
      </div>

      <div class="section-heading section-heading--sm section-heading--snug kr-lost__more text-center">
        <h2>Or read something new</h2>
      </div>
      <div class="row justify-content-center" id="lost-latest"></div>

      <div class="row justify-content-center">
        <div class="col-12 col-lg-8 text-center">
          <!-- Hidden until a photograph has loaded, so it has no size to
               reserve (its frame is picked at random, so neither is there
               one to write down). The inline display only takes effect
               once the script lifts `hidden`. -->
          <figure class="kr-lost mt-4">
            <img id="lost-photo" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" style="display: block; border-radius: 12px;" hidden>
            <figcaption id="lost-photo-caption" class="kr-lost__status" hidden>
              Since you're lost anyway, here's a random photo I took. <a href="/gallery.html">There are <span id="lost-photo-more">490+</span> more.</a>
            </figcaption>
          </figure>
        </div>
      </div>
    </div>
  </div>

  </main>
  <div id="footer-section"></div>

  <script src="/js/site.js?v=20260923a"></script>
  <script src="/js/shared-components.js?v=20260923a"></script>
  <script>
    // No nav item is underlined: a missing page is not the home page.
    renderHeader('header-section', { basePath: '/' });
    renderFooter('footer-section');

    // The three newest posts, as the same cards the rest of the site uses.
    // posts.json is the request the header and footer already made. The
    // card resolves its link and cover from data-kr-root="/", so they are
    // right at whatever URL this page was served.
    loadBlogPosts().then(function(posts) {
      var host = document.getElementById('lost-latest');
      if (!host || !Array.isArray(posts)) return;
      posts.slice(0, 3).forEach(function(post) {
        host.appendChild(createBlogCardElement(post));
      });
    }).catch(function() {});

    // Since you're lost anyway: a random photograph, shown once it loads.
    krFetchJson('data/photography-standard-files.json').then(function(files) {
      if (!Array.isArray(files) || !files.length) return;
      var pick = String(files[Math.floor(Math.random() * files.length)]);
      var img = document.getElementById('lost-photo');
      img.onload = function() {
        img.hidden = false;
        document.getElementById('lost-photo-caption').hidden = false;
      };
      img.alt = 'A random photograph from the gallery';
      img.src = '/img/photography/thumb/' + pick.replace(/\.[^.]+$/, '') + '.webp';
    }).catch(function() {});

    // "There are N more": every frame in the gallery but the one shown.
    krFetchJson('data/photography-files.json').then(function(files) {
      var more = document.getElementById('lost-photo-more');
      if (more && Array.isArray(files) && files.length > 1) more.textContent = files.length - 1;
    }).catch(function() {});
  </script>
</body>
</html>
